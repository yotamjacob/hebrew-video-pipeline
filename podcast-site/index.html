<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שיחות על יוגה · פודקאסט</title>
  <meta name="description" content="שיחות על יוגה — פודקאסט על נשימה, תנועה ושקט. האזינו ביוטיוב, ספוטיפיי ואפל." />
  <meta property="og:title" content="שיחות על יוגה · פודקאסט" />
  <meta property="og:description" content="פודקאסט על נשימה, תנועה ושקט." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="img/cover.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple-900: #3B0764;
      --purple-800: #4C1D95;
      --purple-700: #6D28D9;
      --purple-600: #7C3AED;
      --purple-500: #8B5CF6;
      --purple-400: #A78BFA;
      --purple-300: #C4B5FD;
      --purple-100: #EDE9FE;
      --purple-50:  #F5F3FF;
      --bg:         #F2EEF8;
      --white:      #FFFFFF;
      --text:       #1E1033;
      --muted:      #6B7080;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      font-family: 'Heebo', 'Assistant', system-ui, -apple-system, sans-serif;
      color: var(--text);
      min-height: 100svh;
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(120% 80% at 50% -10%, #EADcff 0%, var(--bg) 55%),
        var(--bg);
    }

    /* ── Ambient soft glows (yoga calm) ── */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { width: 460px; height: 460px; top: -160px; right: -120px;
      background: radial-gradient(circle, rgba(167,139,250,0.55), transparent 70%); }
    .glow-2 { width: 420px; height: 420px; bottom: -160px; left: -120px;
      background: radial-gradient(circle, rgba(196,181,253,0.5), transparent 70%); }
    .glow-3 { width: 340px; height: 340px; top: 40%; left: 50%; transform: translateX(-50%);
      background: radial-gradient(circle, rgba(237,233,254,0.7), transparent 70%); }

    /* ── Layout ── */
    .wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 56px 22px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ── Cover art ── */
    .cover {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 3 / 2;
      border-radius: 24px;
      object-fit: cover;
      object-position: center;
      box-shadow:
        0 18px 50px rgba(109, 40, 217, 0.30),
        0 2px 0 rgba(255,255,255,0.5) inset;
      border: 4px solid rgba(255,255,255,0.7);
      animation: floaty 7s ease-in-out infinite;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }

    /* ── Title block ── */
    .eyebrow {
      margin-top: 26px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--purple-600);
      text-transform: none;
    }
    .title {
      margin-top: 8px;
      font-size: clamp(2rem, 9vw, 2.9rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      background: linear-gradient(120deg, var(--purple-800), var(--purple-500));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      margin-top: 16px;
      max-width: 30ch;
      font-size: 1.02rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--muted);
    }

    /* ── Listen buttons ── */
    .listen {
      width: 100%;
      margin-top: 38px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .listen-label {
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--purple-400);
      margin-bottom: 2px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 17px 22px;
      border-radius: 16px;
      font-family: inherit;
      font-size: 1.04rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
      color: #fff;
      background: linear-gradient(130deg, var(--purple-700) 0%, var(--purple-500) 100%);
      box-shadow: 0 8px 26px rgba(109, 40, 217, 0.30);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 38px rgba(109, 40, 217, 0.40);
      opacity: 0.97;
    }
    .btn:active { transform: translateY(0); }
    .btn svg { width: 24px; height: 24px; flex-shrink: 0; }

    /* Per-platform accent (subtle brand tint over the purple base) */
    .btn-youtube {
      background: linear-gradient(130deg, #b1186b 0%, #7C3AED 100%);
      box-shadow: 0 8px 26px rgba(190, 30, 90, 0.28);
    }
    .btn-spotify {
      background: linear-gradient(130deg, #1a9c6b 0%, #6D28D9 100%);
      box-shadow: 0 8px 26px rgba(26, 156, 107, 0.26);
    }
    .btn-apple {
      background: linear-gradient(130deg, #8B5CF6 0%, #4C1D95 100%);
      box-shadow: 0 8px 26px rgba(76, 29, 149, 0.30);
    }

    /* ── Footer ── */
    .footer {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 26px 22px 34px;
      text-align: center;
    }
    .footer-divider {
      width: 56px;
      height: 3px;
      border-radius: 3px;
      background: var(--purple-300);
      margin: 0 auto 20px;
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--white);
      border: 1.5px solid var(--purple-100);
      box-shadow: 0 4px 16px rgba(109, 40, 217, 0.08);
      color: var(--purple-600);
      transition: transform 0.18s, box-shadow 0.18s, color 0.18s, border-color 0.18s;
    }
    .social:hover {
      transform: translateY(-3px);
      color: var(--purple-800);
      border-color: var(--purple-300);
      box-shadow: 0 8px 22px rgba(109, 40, 217, 0.18);
    }
    .social svg { width: 22px; height: 22px; }
    .name-accent {
      color: var(--purple-600);
      font-weight: 600;
    }
    .credit {
      margin-top: 14px;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--purple-700);
    }
    .copyright {
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--muted);
    }

    /* ── Scroll-down indicator ── */
    .scroll-indicator {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--purple-600);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .scroll-indicator.show { opacity: 0.85; }
    .scroll-indicator span {
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.18em;
    }
    .scroll-indicator svg {
      width: 22px;
      height: 22px;
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); opacity: 0.55; }
      50%      { transform: translateY(6px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scroll-indicator svg, .cover { animation: none; }
    }

    @media (max-width: 380px) {
      .wrap { padding-top: 40px; }
    }
  </style>
</head>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Scroll-down indicator: show only when there's more below and user is near the top.
    (function () {
      var hint = document.getElementById('scrollHint');
      function update() {
        var scrollable = document.documentElement.scrollHeight - window.innerHeight;
        var show = scrollable > 40 && window.scrollY < scrollable - 60;
        hint.classList.toggle('show', show);
      }
      update();
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
    })();
  </script>
